<script>
const images=["Sticker.jpg", "Her lies.jpg","The Power of love.jpg","Hallowed.jpg","society.jpg","Fake Empire.jpg","Peter.jpg","After the gold rush.jpg","Mercy Seat.jpg","I am waiting for my man.jpg","Weak.jpg","Cortez the killer.jpg","Flume.jpg","Hey Joe.jpg","The good son.jpg","One more cup of coffee.jpg","Lost in the flood.jpg"];
const gallery=document.getElementById("gallery");
const imageModal=document.getElementById("imageModal");
const modalImg=document.getElementById("modalImg");
const modalLoader=document.getElementById("modalLoader");
const audioPlayer=document.getElementById("audioPlayer");
const audioSource=document.getElementById("audioSource");
const audioContainer=document.getElementById("audioContainer");

let currentIndex = 0;
let isZoomed = false;

// 1. פונקציית עזר לחילוץ השם הבסיסי של הקובץ (בלי הסיומת .jpg)
const getBaseName = n => n.replace(/\.[^.]+$/, "");

// 2. מילון עבור שמות שירים שלא תואמים בדיוק לשם הקובץ שלהם
const specialTitles = {
  "Sticker": "The Sticker Song"
};

// 3. פונקציית הקאפשן החדשה - בודקת קודם אם יש שם מיוחד במילון
const caption = n => {
  const base = getBaseName(n);
  return specialTitles[base] || base;
};

// Render Gallery
images.forEach((n, index) => {
  const f = document.createElement("figure");
  f.innerHTML = `<div class="thumb"><img src="images/${encodeURI(n)}" loading="lazy"></div><figcaption>${caption(n)}</figcaption>`;
  f.onclick = () => openImage(index);
  gallery.appendChild(f);
});

// Audio State listeners
audioPlayer.onplay = () => audioContainer.classList.add('is-playing');
audioPlayer.onpause = () => audioContainer.classList.remove('is-playing');

function openImage(index) {
  currentIndex = index;
  isZoomed = false;
  modalImg.style.transform = "scale(1)";
  
  imageModal.classList.add("open");
  document.body.style.overflow = "hidden";
  updateModal(true); 
}

function updateModal(isFirstOpen = false) {
  modalImg.classList.remove('visible');
  audioContainer.classList.remove('is-playing');
  
  const n = images[currentIndex];
  const newSrc = "images/" + encodeURI(n);
  const delay = isFirstOpen ? 0 : 400;

  setTimeout(() => {
    modalLoader.style.display = "block";
    modalImg.src = newSrc;
    
    /* 
      שימו לב: 
      אם לקובץ המוזיקה שלכם קוראים "The Sticker Song.mp3", השאירו את השורה הבאה כמו שהיא: (caption(n)).
      אם לקובץ המוזיקה שלכם עדיין קוראים "Sticker.mp3", שנו את (caption(n)) ל- (getBaseName(n)).
    */
    audioSource.src = "music/" + encodeURI(caption(n)) + ".mp3";
    
    audioPlayer.load();

    modalImg.onload = () => {
      modalLoader.style.display = "none";
      requestAnimationFrame(() => {
        modalImg.classList.add('visible');
      });
    };
  }, delay);
}

function changeImage(step) {
  currentIndex += step;
  if (currentIndex >= images.length) currentIndex = 0;
  if (currentIndex < 0) currentIndex = images.length - 1;
  isZoomed = false;
  modalImg.style.transform = "scale(1)";
  updateModal();
}

function toggleZoom(e) {
  e.stopPropagation();
  isZoomed = !isZoomed;
  modalImg.style.transform = isZoomed ? "scale(1.4)" : "scale(1)";
  modalImg.style.cursor = isZoomed ? "zoom-out" : "zoom-in";
}

function closeImage() { 
  imageModal.classList.remove("open"); 
  modalImg.classList.remove('visible');
  audioPlayer.pause(); 
  audioContainer.classList.remove('is-playing');
  document.body.style.overflow="auto"; 
}

function closeOnBg(e) { if(e.target.tagName !== 'IMG') closeImage(); }
function openPDF() { document.getElementById("pdfModal").classList.add("open"); document.body.style.overflow="hidden"; }
function closePDF() { document.getElementById("pdfModal").classList.remove("open"); document.body.style.overflow="auto"; }
function openContact() { document.getElementById("contactModal").classList.add("open"); document.body.style.overflow="hidden"; }
function closeContact() { document.getElementById("contactModal").classList.remove("open"); document.body.style.overflow="auto"; }

window.onclick = (e) => {
    if (e.target.classList.contains('modal')) {
        closePDF();
        closeContact();
    }
};

document.addEventListener('keydown', (e) => {
  if (!imageModal.classList.contains("open")) return;
  if (e.key === "ArrowLeft") changeImage(-1);
  if (e.key === "ArrowRight") changeImage(1);
  if (e.key === "Escape") closeImage();
});

let startX = 0;
imageModal.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive:true});
imageModal.addEventListener('touchend', e => {
  let diff = startX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 60) changeImage(diff > 0 ? 1 : -1);
}, {passive:true});
</script>
